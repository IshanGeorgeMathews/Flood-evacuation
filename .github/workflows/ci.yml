name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install ".[pipeline,dev]"
      - name: Tests (API contract runs against recorded fixtures)
        run: pytest -q
      - name: Byte-compile
        run: python -m compileall -q src
